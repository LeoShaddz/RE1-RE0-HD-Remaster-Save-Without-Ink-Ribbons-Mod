name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar MSVC (x86 / 32 bits)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compilar RE0HD_FreeSave
        shell: cmd
        run: |
          mkdir out\RE0HD
          cl /nologo /LD /O2 /MT /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN RE0HD_FreeSave.cpp /Fe:out\RE0HD\RE0HD_FreeSave.asi /Fo:out\RE0HD\ user32.lib kernel32.lib
          copy RE0HD_FreeSave.ini out\RE0HD\

      - name: Compilar RE1HD_FreeSave
        shell: cmd
        run: |
          mkdir out\RE1HD
          cl /nologo /LD /O2 /MT /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN RE1HD_FreeSave.cpp /Fe:out\RE1HD\RE1HD_FreeSave.asi /Fo:out\RE1HD\ user32.lib kernel32.lib
          copy RE1HD_FreeSave.ini out\RE1HD\

      - name: Verificar que são 32 bits
        shell: cmd
        run: |
          dumpbin /headers out\RE0HD\RE0HD_FreeSave.asi | findstr /C:"machine"
          dumpbin /headers out\RE1HD\RE1HD_FreeSave.asi | findstr /C:"machine"

      - name: Enviar RE0HD_FreeSave
        uses: actions/upload-artifact@v4
        with:
          name: RE0HD_FreeSave
          path: out/RE0HD/*

      - name: Enviar RE1HD_FreeSave
        uses: actions/upload-artifact@v4
        with:
          name: RE1HD_FreeSave
          path: out/RE1HD/*
